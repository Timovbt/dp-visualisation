[streams]
data_stream_name = 'mockup_random1'
marker_stream_name = 'stimulation_marker_stream'
start_eval_marker = 'stimulation_start'
decoder_stream_name = 'visualisation_decoder-stream'
buffer_size_s = 5.0
padding_size_s = 0.5

[stimulus]
presentation_rate_hz = 60
tmin_s = 0.0
tmax_s = 4.2

[data]
selected_channels = ["all"] #['Oz',"Pz"]
capfile = "./cvep_decoder/caps/biosemi7.loc"
target_freq_hz = 120
passband_hz = [6, 40]

[decoder]
encoding_length_s = 0.3
tmin_s = 0.0
segment_time_s = 0.1
min_time_s = 0.3
max_time_s = 4.0
cr = 1.0

[online]
sleep_s = 0.1  # time between updates in seconds
max_eval_time_s = 10  # maximum time for continuous evaluation

[visualisation]
output_port = 8088
output_address = '127.0.0.1' #localhost